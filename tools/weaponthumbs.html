<!doctype html>
<html lang="vi"><head><meta charset="utf-8" /><title>Chụp ảnh binh khí</title></head>
<body style="background:#333;color:#ddd;font:13px monospace"><pre id="log">Đang chụp...</pre><div id="out" style="display:flex;flex-wrap:wrap;gap:6px"></div>
<script type="module">
import * as THREE from 'three';
import { loadGLTF } from '/src/engine/assets.js';
const NAMES = (new URLSearchParams(location.search).get('ids') || '').split(',').filter(Boolean);
const S = 192;
const r = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
r.setSize(S, S); r.setPixelRatio(1); r.outputColorSpace = THREE.SRGBColorSpace; r.toneMapping = THREE.ACESFilmicToneMapping; r.setClearColor(0, 0);
for (const n of NAMES) {
  const scene = new THREE.Scene();
  scene.add(new THREE.HemisphereLight(0xfff4e0, 0x403020, 2.4));
  const k = new THREE.DirectionalLight(0xffffff, 2.5); k.position.set(2, 3, 4); scene.add(k);
  const m = (await loadGLTF(`/assets/weapons/${n}.glb`)).scene.clone(true);
  const holder = new THREE.Group(); holder.add(m); scene.add(holder);
  holder.rotation.z = -0.75; holder.rotation.y = 0.35;
  holder.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(holder), c = box.getCenter(new THREE.Vector3()), size = box.getSize(new THREE.Vector3());
  const R = Math.max(size.x, size.y, size.z) * 0.62;
  const cam = new THREE.PerspectiveCamera(30, 1, 0.001, 100);
  cam.position.set(c.x, c.y, c.z + R / Math.tan(THREE.MathUtils.degToRad(15))); cam.lookAt(c);
  r.render(scene, cam);
  const blob = await new Promise((res) => r.domElement.toBlob(res, 'image/png'));
  await fetch(`/__save?dir=thumbs&name=wpn_${n}.png`, { method: 'POST', body: blob });
  const img = new Image(); img.src = URL.createObjectURL(blob); img.width = 110; img.title = n; img.style.background = '#1a120c';
  const d = document.createElement('div'); d.append(img, Object.assign(document.createElement('div'), { textContent: n }));
  document.getElementById('out').appendChild(d);
}
document.getElementById('log').textContent = 'HOÀN TẤT';
</script></body></html>
