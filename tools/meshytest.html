<!doctype html>
<html lang="vi"><head><meta charset="utf-8" /><title>Thử nhân vật Meshy</title>
<style>body{margin:0;background:#2a2620;color:#ddd;font:13px monospace}#log{position:fixed;left:8px;top:8px}</style></head>
<body><pre id="log"></pre>
<script type="module">
import * as THREE from 'three';
import { MeshyCharacter, MESHY_MODELS } from '/src/actors/meshy.js';
const r = new THREE.WebGLRenderer({ antialias: true }); r.setSize(innerWidth, innerHeight); r.outputColorSpace = THREE.SRGBColorSpace; r.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(r.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x3a3530);
scene.add(new THREE.HemisphereLight(0xfff2dc, 0x404030, 2)); const sun = new THREE.DirectionalLight(0xffffff, 2.2); sun.position.set(3, 6, 5); scene.add(sun);
const ground = new THREE.Mesh(new THREE.CircleGeometry(12, 32).rotateX(-Math.PI / 2), new THREE.MeshStandardMaterial({ color: 0x6a7a50 })); scene.add(ground);
const cam = new THREE.PerspectiveCamera(32, innerWidth / innerHeight, 0.1, 100); cam.position.set(0, 2.2, 9); cam.lookAt(0, 0.9, 0);
const q = new URLSearchParams(location.search);
const anim = q.get('anim') || 'Idle_Loop', weapon = q.get('w') || 'sword';
const chars = [];
for (const [i, m] of MESHY_MODELS.entries()) {
  const c = await MeshyCharacter.create(m.file, weapon);
  c.root.position.set((i - 1.5) * 1.25, 0, 0);
  c.root.rotation.y = Number(q.get('yaw') || 0.35);
  scene.add(c.root);
  c.play(anim);
  chars.push(c);
}
window.__chars = chars;
document.getElementById('log').textContent = anim + ' · ' + weapon;
const clock = new THREE.Clock();
window.__t = Number(q.get('t') || 0);
r.setAnimationLoop(() => { const dt = Math.min(0.05, clock.getDelta()); for (const c of chars) q.get('noretarget') ? c.driver.update(dt) : c.update(dt); r.render(scene, cam); });
window.__ready = true;
</script></body></html>
