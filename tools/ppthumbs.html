<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:transparent}</style>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script></head>
<body><canvas id="c" width="256" height="256"></canvas>
<script type="module">
// Chụp ảnh biểu tượng cho vũ khí tải thêm: ?m=pp_katana → window.__done
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const name = new URLSearchParams(location.search).get('m');
const r = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), alpha: true, antialias: true, preserveDrawingBuffer: true });
r.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
scene.add(new THREE.HemisphereLight(0xffffff, 0x554433, 2.2));
const d = new THREE.DirectionalLight(0xffffff, 2.5); d.position.set(2, 3, 4); scene.add(d);
const cam = new THREE.PerspectiveCamera(30, 1, 0.01, 100);
new GLTFLoader().load(new URLSearchParams(location.search).get('p') || `/public/assets/weapons/${name}.glb`, (g) => {
  const o = g.scene, box = new THREE.Box3().setFromObject(o), size = box.getSize(new THREE.Vector3()), c = box.getCenter(new THREE.Vector3());
  o.position.sub(c);
  const pivot = new THREE.Group(); pivot.add(o); scene.add(pivot);
  // trục dài nhất nằm chéo khung hình
  const axis = size.x > size.y && size.x > size.z ? 'x' : size.y > size.z ? 'y' : 'z';
  if (axis === 'x') pivot.rotation.z = Math.PI / 4; else if (axis === 'y') pivot.rotation.z = -Math.PI / 4; else { pivot.rotation.x = Math.PI / 2; pivot.rotation.z = -Math.PI / 4; }
  pivot.rotation.y += 0.35;
  const L = Math.max(size.x, size.y, size.z);
  cam.position.set(0, 0, L * 2.05); cam.lookAt(0, 0, 0);
  r.render(scene, cam); window.__done = true;
});
</script></body></html>
