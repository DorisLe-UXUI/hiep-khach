<!doctype html>
<html lang="vi"><head><meta charset="utf-8" /><title>Chụp ảnh chiến lợi phẩm</title></head>
<body style="background:#333;color:#ddd;font:13px monospace"><pre id="log">Đang chụp...</pre><div id="out" style="display:flex;flex-wrap:wrap;gap:6px"></div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';
import { OBJLoader } from 'three/examples/jsm/loaders/OBJLoader.js';
import { MTLLoader } from 'three/examples/jsm/loaders/MTLLoader.js';
import { THUMB_JOBS } from '/src/game/loot.js';
const only = new URLSearchParams(location.search).get('only');
const S = 192;
const r = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
r.setSize(S, S); r.setPixelRatio(1); r.outputColorSpace = THREE.SRGBColorSpace; r.toneMapping = THREE.ACESFilmicToneMapping; r.setClearColor(0, 0);
const gltf = new GLTFLoader();
async function load(path) {
  if (path.endsWith('.glb')) return (await gltf.loadAsync(path)).scene;
  const mtl = await new MTLLoader().loadAsync(path.replace(/\.obj$/, '.mtl'));
  mtl.preload();
  return new OBJLoader().setMaterials(mtl).loadAsync(path);
}
let n = 0;
for (const [name, path] of THUMB_JOBS) {
  if (only && !name.includes(only)) continue;
  const scene = new THREE.Scene();
  scene.add(new THREE.HemisphereLight(0xfff4e0, 0x403020, 2.6));
  const k = new THREE.DirectionalLight(0xffffff, 2.6); k.position.set(2, 3, 4); scene.add(k);
  const m = await load(path);
  const holder = new THREE.Group(); holder.add(m); scene.add(holder);
  const weapon = path.includes('quaternius');
  // binh khí: nghiêng chéo như ảnh KayKit; đồ vật: nhìn hơi từ trên xuống
  if (weapon) {
    const b0 = new THREE.Box3().setFromObject(m).getSize(new THREE.Vector3());
    if (b0.x > b0.y && b0.x > b0.z) m.rotation.z = Math.PI / 2; else if (b0.z > b0.y) m.rotation.x = Math.PI / 2;
    holder.rotation.z = -0.75; holder.rotation.y = 0.35;
  } else { holder.rotation.x = 0.45; holder.rotation.y = -0.6; }
  holder.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(holder), c = box.getCenter(new THREE.Vector3()), size = box.getSize(new THREE.Vector3());
  const R = Math.max(size.x, size.y, size.z) * 0.62;
  const cam = new THREE.PerspectiveCamera(30, 1, 0.001, 100);
  cam.position.set(c.x, c.y, c.z + R / Math.tan(THREE.MathUtils.degToRad(15))); cam.lookAt(c);
  r.render(scene, cam);
  const blob = await new Promise((res) => r.domElement.toBlob(res, 'image/png'));
  await fetch(`/__save?dir=thumbs&name=${name}.png`, { method: 'POST', body: blob });
  const img = new Image(); img.src = URL.createObjectURL(blob); img.width = 96; img.title = name; img.style.background = '#1a120c';
  const d = document.createElement('div'); d.append(img, Object.assign(document.createElement('div'), { textContent: name, style: 'width:96px;overflow:hidden;font-size:10px' }));
  document.getElementById('out').appendChild(d);
  n++;
}
document.getElementById('log').textContent = 'HOÀN TẤT ' + n;
</script></body></html>
