<!doctype html>
<html lang="vi">
<head><meta charset="utf-8" /><title>Chụp chân dung quái</title></head>
<body style="background:#333;color:#ddd;font:14px monospace">
  <pre id="log">Đang chụp...</pre>
  <div id="out" style="display:flex;flex-wrap:wrap;gap:6px"></div>
  <script type="module">
    import * as THREE from 'three';
    import { MONSTERS } from '/src/game/bestiary.js';
    import { MonsterCharacter } from '/src/actors/monster.js';

    const S = 256;
    const log = (s) => (document.getElementById('log').textContent += '\n' + s);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
    renderer.setSize(S, S);
    renderer.setPixelRatio(1);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    renderer.setClearColor(0x000000, 0);
    const folk = new URLSearchParams(location.search).get('folk');
    const FOLKS = [...'abcdef'.split('').flatMap((l) => [`mini-male-${l}`, `mini-female-${l}`]), ...'abcdefghijklmnopqr'.split('').map((l) => `blocky-${l}`)];
    const ids = folk ? FOLKS : new URLSearchParams(location.search).get('ids')?.split(',') || Object.keys(MONSTERS);
    for (const id of ids) {
      const m = folk ? { file: `/assets/folk/${id}.glb`, name: id } : MONSTERS[id];
      const scene = new THREE.Scene();
      scene.add(new THREE.HemisphereLight(0xfff2dc, 0x302018, 1.8));
      const key = new THREE.DirectionalLight(0xffffff, 2.6); key.position.set(2, 3, 4); scene.add(key);
      const rim = new THREE.DirectionalLight(0xffc890, 2); rim.position.set(-3, 2, -3); scene.add(rim);
      const c = await MonsterCharacter.create({ file: m.file, height: 1.6 });
      c.play('Idle_Loop', { fade: 0 });
      c.mixer.update(0.4);
      c.root.rotation.y = 0.45;
      scene.add(c.root);
      c.root.updateMatrixWorld(true);
      const box = new THREE.Box3().setFromObject(c.model);
      const center = box.getCenter(new THREE.Vector3()), size = box.getSize(new THREE.Vector3());
      const cam = new THREE.PerspectiveCamera(30, 1, 0.01, 50);
      const r = Math.max(size.x, size.y, size.z) * 0.62;
      cam.position.set(center.x, center.y + r * 0.25, center.z + r / Math.tan(THREE.MathUtils.degToRad(15)));
      cam.lookAt(center);
      renderer.render(scene, cam);
      const blob = await new Promise((res) => renderer.domElement.toBlob(res, 'image/png'));
      await fetch(`/__save?dir=thumbs&name=${folk ? 'folk_' + id.replace(/-/g, '_') : 'mon_' + id}.png`, { method: 'POST', body: blob });
      const img = new Image(); img.src = URL.createObjectURL(blob); img.width = 80; img.title = m.name; img.style.background = '#1a120c';
      document.getElementById('out').appendChild(img);
    }
    log('HOÀN TẤT');
  </script>
</body>
</html>
